# ============================================================================
# BPM Platform — GO-LIVE 1 server (Docker Compose)
#   mariadb  : CSDL (volume bền, healthcheck)
#   backend  : Spring Boot (profile prod), phụ thuộc mariadb healthy
#   frontend : Angular qua nginx (phục vụ SPA + proxy /api,/actuator → backend)
#
# Bí mật/điểm kết nối đọc từ file .env (xem .env.example). KHÔNG hard-code mật khẩu thật.
# OnlyOffice/BPM-doc KHÔNG bao gồm trong bản này.
# ============================================================================

services:
  mariadb:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${MYSQL_DATABASE:-bpm}
      MARIADB_USER: ${BPM_DB_USER:-bpm}
      MARIADB_PASSWORD: ${BPM_DB_PASSWORD:?Đặt BPM_DB_PASSWORD trong .env}
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Đặt MYSQL_ROOT_PASSWORD trong .env}
    volumes:
      - mariadb-data:/var/lib/mysql
    networks:
      - bpm-net
    # Publish 3306 ra host. Mặc định CHỈ loopback (127.0.0.1) — an toàn, không lộ internet.
    # Muốn LOCAL nối thẳng server-ip:3306 → đặt BPM_DB_BIND_ADDR=0.0.0.0 trong .env server
    # (kèm firewall giới hạn IP nguồn). Khoá hẳn (chỉ mạng compose) → xoá mục ports này.
    ports:
      - "${BPM_DB_BIND_ADDR:-127.0.0.1}:${BPM_DB_HOST_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      # --- Kết nối DB (service 'mariadb' trong mạng compose) ---
      BPM_DB_URL: ${BPM_DB_URL:-jdbc:mariadb://mariadb:3306/bpm}
      BPM_DB_USER: ${BPM_DB_USER:-bpm}
      BPM_DB_PASSWORD: ${BPM_DB_PASSWORD:?Đặt BPM_DB_PASSWORD trong .env}
      # --- Schema: lần go-live ĐẦU TIÊN dùng 'update' để Hibernate tạo bảng.
      #     Sau khi schema ổn định, đặt BPM_DDL_AUTO=validate trong .env (xem ops/DEPLOY.md). ---
      BPM_DDL_AUTO: ${BPM_DDL_AUTO:-update}
      # --- Flowable: lần go-live ĐẦU TIÊN đặt 'true' để tạo bảng ACT_*.
      #     Sau khi schema ổn định, đặt BPM_FLOWABLE_SCHEMA_UPDATE=false trong .env. ---
      BPM_FLOWABLE_SCHEMA_UPDATE: ${BPM_FLOWABLE_SCHEMA_UPDATE:-false}
      # --- Tài khoản admin khởi tạo (AdminSeeder đọc env này) ---
      BPM_ADMIN_PASSWORD: ${BPM_ADMIN_PASSWORD:?Đặt BPM_ADMIN_PASSWORD trong .env}
      # --- Mật khẩu mặc định khi tạo nhân sự/tài khoản hàng loạt (nếu BE dùng) ---
      BPM_HR_DEFAULT_PASSWORD: ${BPM_HR_DEFAULT_PASSWORD:-ChangeMe@123}
      # --- KHÔNG seed demo ở prod (profile prod vốn không bật, đặt rõ cho chắc) ---
      BPM_SEED_DEMO: "false"
      # --- Ghi log ra file trong volume bền (user 'bpm' ghi được; tránh /var/log) ---
      BPM_LOG_FILE: /app/data/logs/backend.log
      # --- Thư mục media bài viết (trong volume bền) ---
      BPM_MEDIA_DIR: /app/data/media
      # --- OnlyOffice JWT (không dùng bản này, nhưng đặt secret để không kế thừa default dev) ---
      BPM_ONLYOFFICE_JWT_SECRET: ${BPM_ONLYOFFICE_JWT_SECRET:-change-me-not-used}
      JAVA_OPTS: ${JAVA_OPTS:--Xmx768m}
    volumes:
      - backend-data:/app/data
    networks:
      - bpm-net
    # Không publish 8081 ra ngoài: truy cập qua frontend (nginx). Mở nếu cần debug trực tiếp.

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - bpm-net

volumes:
  mariadb-data:
  backend-data:

networks:
  bpm-net:
    driver: bridge
