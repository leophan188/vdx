spring:
  application:
    name: bpm-platform-backend
  lifecycle:
    timeout-per-shutdown-phase: 25s   # Story 5.7: chờ tối đa 25s cho request đang xử lý khi tắt êm
  servlet:
    multipart:                         # GĐ2: cho phép upload video bài viết ≤100MB (Epic 2)
      max-file-size: ${BPM_MAX_FILE:100MB}
      max-request-size: ${BPM_MAX_REQUEST:110MB}
  datasource:
    url: ${BPM_DB_URL:jdbc:mariadb://localhost:3306/bpm}
    username: ${BPM_DB_USER:bpm}
    password: ${BPM_DB_PASSWORD:bpm}
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      # GĐ1 dùng update; chuyển sang Flyway migration + ddl-auto=validate khi ổn định schema.
      ddl-auto: ${BPM_DDL_AUTO:update}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
    open-in-view: false

server:
  # Cổng BE = 8081 để khớp frontend proxy.conf.json (/api -> localhost:8081); tránh đụng 8080.
  port: ${BPM_PORT:8081}
  servlet:
    session:
      timeout: ${BPM_SESSION_TIMEOUT:30m}   # AC-3: phiên hết hạn theo cấu hình
  shutdown: graceful   # Story 5.7: tắt êm — phục vụ nốt request đang xử lý

# Giám sát/readiness cho triển khai (Story 5.7). Health công khai (cho load balancer); chi tiết & metrics nội bộ.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true        # /actuator/health/liveness + /readiness
      show-details: when-authorized
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

# Flowable engine (Epic 3, AD-1). Tự tạo/nâng bảng ACT_*; tắt async executor (chưa cần job nền GĐ này).
flowable:
  database-schema-update: true
  async-executor-activate: false
  # Không auto-deploy file .bpmn từ classpath — quy trình deploy động từ định nghĩa đã publish.
  check-process-definitions: false

# OnlyOffice Document Server (Story 3.10). url = trình duyệt tải api.js; callback-host = địa chỉ OnlyOffice
# (trong VM) gọi NGƯỢC backend (host.docker.internal vì OnlyOffice ở container Colima); jwt-secret khớp docker-compose.
bpm:
  onlyoffice:
    url: ${BPM_ONLYOFFICE_URL:http://localhost:8082}
    callback-host: ${BPM_ONLYOFFICE_CALLBACK_HOST:http://host.docker.internal:8081}
    jwt-secret: ${BPM_ONLYOFFICE_JWT_SECRET:bpm-local-dev-secret}
  # GĐ2 — Cổng nội bộ
  gsheet:                                              # Epic 1: đọc Google Sheet (CSV export)
    export-base: ${BPM_GSHEET_EXPORT_BASE:https://docs.google.com/spreadsheets/d}
    timeout-seconds: ${BPM_GSHEET_TIMEOUT:20}
  media:
    dir: ${BPM_MEDIA_DIR:./data/media}                # Epic 2: lưu ảnh/video bài viết trên đĩa

logging:
  level:
    org.springframework.security: INFO
