# Hồ sơ TRIỂN KHAI (Story 5.7): kích hoạt bằng --spring.profiles.active=prod.
# Mọi bí mật/điểm kết nối lấy qua biến môi trường — KHÔNG hard-code trong ảnh build.
spring:
  datasource:
    url: ${BPM_DB_URL:jdbc:mariadb://localhost:3306/bpm}
    username: ${BPM_DB_USER}
    password: ${BPM_DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      # Quy mô 100–500 user: pool vừa phải, có timeout rõ ràng để tránh treo kết nối.
      maximum-pool-size: ${BPM_DB_POOL_MAX:20}
      minimum-idle: ${BPM_DB_POOL_MIN:5}
      connection-timeout: 30000
      max-lifetime: 1800000
      pool-name: bpm-hikari
  jpa:
    hibernate:
      # PROD: KHÔNG để Hibernate đổi schema. Dùng migration (Flyway/Liquibase) + validate.
      ddl-auto: ${BPM_DDL_AUTO:validate}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        jdbc:
          batch_size: 30
    open-in-view: false

# Flowable: KHÔNG tự đổi schema ở prod (chạy script DDL của Flowable khi nâng cấp).
flowable:
  database-schema-update: false
  async-executor-activate: true     # bật job nền cho timer/async ở môi trường thật

server:
  forward-headers-strategy: framework   # đứng sau reverse proxy (Nginx) — lấy đúng scheme/host
  tomcat:
    threads:
      max: ${BPM_HTTP_THREADS:200}

management:
  endpoint:
    health:
      show-details: never        # PROD: ẩn chi tiết health với client ngoài

logging:
  level:
    root: INFO
    com.bpm: INFO
    org.flowable: WARN
    org.hibernate.SQL: WARN
  file:
    name: ${BPM_LOG_FILE:/var/log/bpm/backend.log}

# Nhắc hạn: chu kỳ thật (mỗi giờ) — Story 4.10/5.7.
bpm:
  reminder:
    fixed-delay-ms: ${BPM_REMINDER_DELAY_MS:3600000}
