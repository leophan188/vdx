# Profile 'local' — chạy standalone bằng H2 (không cần MariaDB).
# H2 LƯU FILE (./data/bpm-local) để dữ liệu thật còn sau khi restart; ddl-auto=update không xoá dữ liệu.
spring:
  datasource:
    url: jdbc:h2:file:./data/bpm-local;DB_CLOSE_DELAY=-1;MODE=LEGACY
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect   # ghi đè MariaDBDialect của application.yml
  h2:
    console:
      enabled: true   # /h2-console để xem dữ liệu khi chạy thử

# Seed dữ liệu DEMO: mặc định TẮT (chỉ có tài khoản admin) để import data thật.
# Bật lại demo: chạy với BPM_SEED_DEMO=true.
bpm:
  seed-demo: ${BPM_SEED_DEMO:false}
