# ============================================================================
# nginx — phục vụ Angular SPA + proxy /api và /actuator sang backend.
# Backend service trong docker-compose: http://backend:8081
# Auth dùng HttpSession (cookie) → cần chuyển cookie & header nguyên vẹn.
# ============================================================================

upstream bpm_backend {
    server backend:8081;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Upload ảnh/video bài viết tới ~110MB (Epic 2) — phải >= BPM_MAX_REQUEST của BE.
    client_max_body_size 120m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        application/wasm image/svg+xml font/ttf font/woff font/woff2;

    # ---- API backend (giữ cookie phiên + header gốc) ----
    location /api/ {
        proxy_pass http://bpm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Không cache API.
        proxy_buffering off;
    }

    # ---- Actuator (health/info) cho giám sát/reverse proxy phía trước ----
    location /actuator/ {
        proxy_pass http://bpm_backend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Tài sản tĩnh có hash (outputHashing: all) → cache dài hạn ----
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ---- SPA fallback: mọi route khác trả index.html ----
    location / {
        try_files $uri $uri/ /index.html;
        # index.html không được cache để client luôn nhận bản build mới.
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
