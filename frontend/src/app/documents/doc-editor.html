<!-- Soạn thảo OnlyOffice nhúng (Story 3.10). -->
<div class="doc-editor">
  <div class="doc-editor__bar">
    <button type="button" class="btn btn--ghost btn--sm" (click)="back()">← Tài liệu</button>
    <strong class="doc-editor__title">{{ title() }}</strong>
    <span style="flex:1"></span>
    <button type="button" class="btn btn--primary btn--sm" (click)="save()">💾 Lưu</button>
  </div>

  @if (error(); as e) {
    <div class="doc-editor__error">
      <p class="alert alert--error">{{ e }}</p>
      <p class="hint">Đảm bảo OnlyOffice đang chạy: <code>docker-compose -f ops/onlyoffice/docker-compose.yml up -d</code> và mở được <a href="http://localhost:8082/" target="_blank" rel="noopener">http://localhost:8082</a>.</p>
    </div>
  }

  <div class="doc-editor__split">
    <div id="onlyoffice-editor" class="doc-editor__frame"></div>
  </div>
</div>
