<section class="page">
  <app-page-header title="Backlog của tôi"
                   subtitle="Backlog đầy đủ (EPIC · Story · task cha/con) của dự án đang chọn, mặc định chỉ hiện việc của bạn. Đổi dự án và lọc thêm ngay ở thanh lọc bên dưới."
                   [breadcrumb]="[{ label: 'Cá nhân' }, { label: 'Backlog của tôi' }]" />

  @if (loading()) {
    <p class="hint" style="padding:16px">Đang tải danh sách dự án…</p>
  } @else if (!projects().length) {
    <div class="mb-empty">🗂️ Bạn chưa tham gia dự án nào.</div>
  } @else {
    <!-- Ô chọn dự án nằm NGAY TRONG thanh lọc của backlog (xem backlog.html), không tách khối
         riêng ở đây nữa: khối trên đầu bị cuộn khuất ngay khi người dùng xem tới danh sách,
         nên nhìn như màn hình không cho chọn dự án. -->
    @if (selectedId()) {
      <app-prj-backlog [projectId]="selectedId()" [presetAssignee]="myUserId()"
                       [projectOptions]="projectSel()" (projectChange)="selectedId.set($event)"
                       (openTask)="openDetail($event)" />
    }
  }

  <!-- Chi tiết task (mở từ backlog) — như màn Quản lý dự án -->
  <app-prj-task-detail [projectId]="selectedId()" [task]="detailTask()" [open]="detailOpen()"
                       (closed)="closeDetail()" (changed)="onTaskChanged()" />
</section>
