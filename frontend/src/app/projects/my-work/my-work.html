<section class="page">
  <app-page-header title="Backlog của tôi"
                   subtitle="Chọn dự án để xem backlog đầy đủ (EPIC · Story · task cha/con) — mặc định lọc theo việc của bạn; thêm việc như màn Quản lý dự án."
                   [breadcrumb]="[{ label: 'Cá nhân' }, { label: 'Backlog của tôi' }]" />

  @if (loading()) {
    <p class="hint" style="padding:16px">Đang tải danh sách dự án…</p>
  } @else if (!projects().length) {
    <div class="mb-empty">🗂️ Bạn chưa tham gia dự án nào.</div>
  } @else {
    <div class="mb-picker">
      <span class="mb-picker__label">Dự án:</span>
      <searchable-select [options]="projectSel()" [value]="selectedId()"
                         (valueChange)="selectedId.set($any($event))" placeholder="Chọn dự án" />
      <span class="mb-hint">Backlog hiển thị đầy đủ các cấp; đang lọc theo việc của bạn (đổi được trong bộ lọc “Người thực hiện”).</span>
    </div>

    @if (selectedId()) {
      <app-prj-backlog [projectId]="selectedId()" [presetAssignee]="myUserId()"
                       (openTask)="openDetail($event)" />
    }
  }

  <!-- Chi tiết task (mở từ backlog) — như màn Quản lý dự án -->
  <app-prj-task-detail [projectId]="selectedId()" [task]="detailTask()" [open]="detailOpen()"
                       (closed)="closeDetail()" (changed)="onTaskChanged()" />
</section>
