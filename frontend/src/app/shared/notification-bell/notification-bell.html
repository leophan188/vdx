<!-- Chuông thông báo (Story 4.9). -->
<div class="noti">
  <button type="button" class="topbar__icon-btn noti__btn" (click)="toggle()"
          [attr.aria-label]="'Thông báo' + (unread() > 0 ? ' (' + unread() + ' chưa đọc)' : '')"
          [attr.aria-expanded]="open()" aria-haspopup="true">
    <span class="noti__icon" [class.noti__icon--ring]="ring()" aria-hidden="true">🔔</span>
    @if (unread() > 0) { <span class="noti__badge" aria-hidden="true">{{ unread() > 99 ? '99+' : unread() }}</span> }
  </button>

  @if (open()) {
    <div class="noti__backdrop" (click)="open.set(false)"></div>
    <div class="noti__panel">
      <div class="noti__head">
        <strong>Thông báo</strong>
        @if (unread() > 0) { <button type="button" class="noti__mark" (click)="markAll()">Đánh dấu đã đọc</button> }
      </div>
      <div class="noti__list">
        @for (n of items(); track n.id) {
          <div class="noti__item" [class.noti__item--unread]="!n.read" (click)="click(n)" role="button" tabindex="0"
               style="display:flex; gap:10px; align-items:flex-start;">
            <span class="noti__dot" style="flex:none;"></span>
            <span class="noti__body" style="display:flex; flex-direction:column; gap:3px; min-width:0; flex:1 1 auto;">
              <strong style="display:block; font-size:13.5px; font-weight:600; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ n.title }}</strong>
              @if (preview(n.body)) {
                <small style="display:block; font-size:12px; line-height:1.45; color:var(--color-text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;">{{ preview(n.body) }}</small>
              }
              <small style="display:block; font-size:11px; line-height:1.3; color:var(--color-text-muted); opacity:.8; white-space:nowrap;">{{ fmt(n.createdAt) }}</small>
            </span>
          </div>
        }
        @if (!items().length) { <p class="hint" style="padding:16px;text-align:center">Chưa có thông báo.</p> }
      </div>
    </div>
  }
</div>
